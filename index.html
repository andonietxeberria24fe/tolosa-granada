<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f7f8fa">

  <title>El viaje</title>

  <link rel="icon" href="data:,">

  <link
    rel="stylesheet"
    href="/tolosa-granada/css/style.css"
  >
</head>

<body>

<main id="app">

  <!-- CABECERA -->
  <header class="header">

    <div class="eyebrow">
      UN VIAJE PARA RECORDAR
    </div>

    <h1>
      El viaje <span>✦</span>
    </h1>

  </header>


  <!-- SELECTOR SUPERIOR DE VIAJE -->
  <div
    id="mode-switch"
    class="mode-switch"
  >

    <button
      class="mode-button selected"
      data-mode="direct"
      type="button"
    >
      ✈️
      <span>Tolosa → Granada</span>
    </button>

    <button
      class="mode-button"
      data-mode="real"
      type="button"
    >
      🚙
      <span>El viaje de verdad</span>
    </button>

  </div>


  <!-- PANTALLA INICIAL -->
  <section
    id="start-screen"
    class="start-screen"
  >

    <div class="start-card">

      <div class="start-eyebrow">
        NUESTRO VIAJE
      </div>

      <h2>
        ¿Qué viaje quieres hacer?
      </h2>


      <div class="trip-options">

        <button
          class="trip-option selected"
          data-mode="direct"
          type="button"
        >

          <span class="trip-option-icon">
            ✈️
          </span>

          <span class="trip-option-text">

            <strong>
              Tolosa → Granada
            </strong>

            <small>
              El viaje directo
            </small>

          </span>

          <span class="trip-check">
            ✓
          </span>

        </button>


        <button
          class="trip-option"
          data-mode="real"
          type="button"
        >

          <span class="trip-option-icon">
            🚙
          </span>

          <span class="trip-option-text">

            <strong>
              El viaje de verdad
            </strong>

            <small>
              Tolosa → Granada con todas las paradas
            </small>

          </span>

          <span class="trip-check">
            ✓
          </span>

        </button>

      </div>


      <button
        id="start-trip"
        class="primary-button"
        type="button"
      >
        Seguimos <span>→</span>
      </button>

    </div>

  </section>


  <!-- MAPA -->
  <div id="map-container">

    <div
      id="map"
      aria-label="Mapa del recorrido"
    ></div>

  </div>


  <!-- BOTÓN AVANZAMOS -->
  <button
    id="continue-trip"
    class="floating-continue"
    type="button"
  >
    Avanzamos <span>→</span>
  </button>


  <!-- PARADAS -->
  <button
    id="open-stops"
    class="mobile-stops-button"
    aria-expanded="false"
    type="button"
  >
    <span>☷</span>
    Paradas
    <span id="stop-count"></span>
  </button>


  <aside
    id="stops-panel"
    class="stops-panel"
    aria-label="Paradas del viaje"
  >

    <div class="sheet-grabber"></div>

    <div class="panel-heading">

      <div>

        <div class="eyebrow">
          EL RECORRIDO
        </div>

        <h2>
          Paradas
        </h2>

      </div>


      <button
        id="close-stops"
        class="icon-button"
        aria-label="Cerrar paradas"
        type="button"
      >
        ×
      </button>

    </div>


    <ol
      id="stop-list"
      class="stop-list"
    ></ol>


    <p
      id="travel-status"
      class="travel-status"
    >
      Preparados para salir
    </p>

  </aside>


  <!-- CAJÓN DE RECUERDOS -->
  <section
    id="memory-panel"
    class="memory-panel"
    aria-hidden="true"
  >

    <div
      id="memory-grabber"
      class="memory-grabber"
    ></div>


    <div class="memory-top">

      <span class="eyebrow">
        UN RECUERDO DEL VIAJE
      </span>


      <div class="memory-top-actions">

        <button
          id="expand-memory"
          class="memory-expand"
          type="button"
          aria-label="Subir recuerdos"
        >
          ⌃
        </button>


        <button
          id="close-memory"
          class="icon-button"
          aria-label="Cerrar recuerdo"
          type="button"
        >
          ×
        </button>

      </div>

    </div>


    <div
      id="memory-content"
      class="memory-content"
    ></div>

  </section>


</main>


<script src="/tolosa-granada/js/map.js"></script>
<script src="/tolosa-granada/js/gallery.js"></script>
<script src="/tolosa-granada/js/app.js"></script>

</body>
</html>
