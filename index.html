<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7f2">
  <meta name="description" content="El viaje de Tolosa a Granada">
  <title>El viaje ✦</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <header class="header">
      <div class="eyebrow">UN VIAJE PARA RECORDAR</div>
      <h1>El viaje <span>✦</span></h1>
      <p>De Tolosa a Granada, con alguna parada que merece la pena recordar.</p>
    </header>

    <nav class="mode-switch" aria-label="Modo de viaje">
      <button class="mode-button active" data-mode="real" type="button">
        <span>🚙</span> El viaje de verdad
      </button>

      <button class="mode-button" data-mode="direct" type="button">
        <span>✈️</span> Tolosa → Granada
      </button>
    </nav>

    <div id="map-container">
      <div id="map" aria-label="Mapa del recorrido"></div>

      <div id="vehicle" aria-hidden="true">🚙</div>

      <div id="trip-badge" class="trip-badge">
        <span id="trip-badge-icon">🚙</span>
        <span id="trip-badge-text">Ruta por carretera</span>
      </div>

      <button id="start-trip" class="start-trip-button" type="button">
        <span class="start-icon">🚙</span>
        <span id="start-trip-label">Comenzar el viaje</span>
        <span class="button-arrow">→</span>
      </button>
    </div>

    <div
      id="arrival-backdrop"
      class="arrival-backdrop"
      aria-hidden="true"
    >
      <section
        id="arrival-modal"
        class="arrival-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="arrival-title"
      >
        <div class="arrival-topbar">
          <div id="arrival-kicker" class="eyebrow">
            HAS LLEGADO
          </div>

          <button
            id="close-arrival"
            class="close-button"
            type="button"
            aria-label="Cerrar ventana"
          >
            ×
          </button>
        </div>

        <div id="arrival-view" class="arrival-view"></div>

        <div id="arrival-actions" class="arrival-actions">
          <button
            id="arrival-continue"
            class="modal-button primary"
            type="button"
          >
            <span>Seguimos</span>
            <span>→</span>
          </button>

          <button
            id="arrival-memory"
            class="modal-button secondary"
            type="button"
          >
            <span>Recuerdos</span>
            <span>📸</span>
          </button>
        </div>

        <div id="memory-actions" class="memory-actions" hidden>
          <button
            id="memory-back"
            class="modal-button secondary full"
            type="button"
          >
            <span>← Volver a la parada</span>
            <span>📍</span>
          </button>
        </div>
      </section>
    </div>
  </main>

  <script src="js/map.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
