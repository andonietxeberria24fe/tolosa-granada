<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f7f8fa"
  >

  <title>El viaje</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

  <main id="app">

    <header class="header">
      <div class="eyebrow">
        UN VIAJE PARA RECORDAR
      </div>

      <h1>
        El viaje
        <span>✦</span>
      </h1>
    </header>


    <!-- CAMBIO DE VIAJE -->
    <nav
      class="mode-switch"
      aria-label="Modo de viaje"
    >

      <button
        class="mode-button active"
        data-mode="real"
        type="button"
      >
        El viaje de verdad
      </button>

      <button
        class="mode-button"
        data-mode="direct"
        type="button"
      >
        Tolosa → Granada
      </button>

    </nav>


    <!-- MAPA -->
    <div id="map-container">

      <div
        id="map"
        aria-label="Mapa del recorrido"
      ></div>

      <!-- VEHÍCULO -->
      <div
        id="vehicle"
        aria-hidden="true"
      >
        🚙
      </div>

    </div>


    <!-- BOTÓN PARADAS EN MÓVIL -->
    <button
      id="open-stops"
      class="mobile-stops-button"
      aria-expanded="false"
      type="button"
    >
      <span>☷</span>
      Paradas
      <span id="stop-count"></span>
    </button>


    <!-- PANEL PARADAS -->
    <aside
      id="stops-panel"
      class="stops-panel"
      aria-label="Paradas del viaje"
    >

      <div class="sheet-grabber"></div>

      <div class="panel-heading">

        <div>

          <div class="eyebrow">
            EL RECORRIDO
          </div>

          <h2>
            Paradas
          </h2>

        </div>

        <button
          id="close-stops"
          class="icon-button"
          aria-label="Cerrar paradas"
          type="button"
        >
          ×
        </button>

      </div>

      <ol
        id="stop-list"
        class="stop-list"
      ></ol>

      <p
        id="travel-status"
        class="travel-status"
      >
        Preparados para salir
      </p>

    </aside>
    <div id="stop-actions" class="stop-actions">
  <button id="continue-stop" class="primary-button" type="button">
    Seguimos <span>→</span>
  </button>

  <button id="open-memory" class="secondary-button" type="button">
    Recuerdos
  </button>
</div>


    <!-- PANEL RECUERDO -->
    <section
      id="memory-panel"
      class="memory-panel"
      aria-hidden="true"
    >

      <div class="sheet-grabber"></div>

      <div class="memory-top">

        <span class="eyebrow">
          UN RECUERDO DEL VIAJE
        </span>

        <button
          id="close-memory"
          class="icon-button"
          aria-label="Cerrar recuerdo"
          type="button"
        >
          ×
        </button>

      </div>

      <div
        id="memory-content"
        class="memory-content"
      ></div>

      <div class="memory-actions">

        <button
          id="continue-trip"
          class="primary-button"
          type="button"
        >
          <span>
            Seguimos
          </span>

          <span>
            →
          </span>
        </button>

      </div>

    </section>

  </main>


  <script src="js/map.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
