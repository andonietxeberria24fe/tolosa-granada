
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#f7f8fa">

  <title>El viaje</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main id="app">

    <header class="header">
      <div class="eyebrow">UN VIAJE PARA RECORDAR</div>

      <h1>
        El viaje
        <span aria-hidden="true">✦</span>
      </h1>
    </header>

    <!-- Selector de modo -->
    <nav class="mode-switch" aria-label="Modo de viaje">
      <button
        class="mode-button active"
        data-mode="real"
        type="button"
        aria-pressed="true"
      >
        El viaje de verdad
      </button>

      <button
        class="mode-button"
        data-mode="direct"
        type="button"
        aria-pressed="false"
      >
        Tolosa → Granada
      </button>
    </nav>

    <!-- Mapa y vehículo -->
    <div id="map-container">
      <div id="map" aria-label="Mapa del recorrido"></div>

      <div id="vehicle" aria-hidden="true">🚙</div>
    </div>

    <!-- Botón para abrir las paradas en móvil -->
    <button
      id="open-stops"
      class="mobile-stops-button"
      type="button"
      aria-controls="stops-panel"
      aria-expanded="false"
    >
      <span aria-hidden="true">☷</span>
      Paradas
      <span id="stop-count"></span>
    </button>

    <!-- Panel de paradas -->
    <aside
      id="stops-panel"
      class="stops-panel"
      aria-label="Paradas del viaje"
      aria-hidden="false"
    >
      <div class="sheet-grabber" aria-hidden="true"></div>

      <div class="panel-heading">
        <div>
          <div class="eyebrow">EL RECORRIDO</div>
          <h2>Paradas</h2>
        </div>

        <button
          id="close-stops"
          class="icon-button"
          type="button"
          aria-label="Cerrar paradas"
        >
          ×
        </button>
      </div>

      <ol id="stop-list" class="stop-list"></ol>

      <p id="travel-status" class="travel-status" aria-live="polite">
        Preparados para salir
      </p>
    </aside>

    <!-- Acciones principales -->
    <div id="stop-actions" class="stop-actions">
      <button id="continue-stop" class="primary-button" type="button">
        Seguimos <span aria-hidden="true">→</span>
      </button>

      <button id="open-memory" class="secondary-button" type="button">
        Recuerdos
      </button>
    </div>

    <!-- Panel de recuerdos -->
    <section
      id="memory-panel"
      class="memory-panel"
      aria-label="Recuerdo de la parada"
      aria-hidden="true"
    >
      <div class="sheet-grabber" aria-hidden="true"></div>

      <div class="memory-top">
        <span class="eyebrow">UN RECUERDO DEL VIAJE</span>

        <button
          id="close-memory"
          class="icon-button"
          type="button"
          aria-label="Cerrar recuerdo"
        >
          ×
        </button>
      </div>

      <div id="memory-content" class="memory-content"></div>

      <div class="memory-actions">
        <button id="continue-trip" class="primary-button" type="button">
          <span>Seguimos</span>
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </section>

  </main>

  <!-- Cargar en este orden: mapa, recuerdos y aplicación -->
  <script src="js/map.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
