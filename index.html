<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tolosa — Granada</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="main-header">
      <span class="header-kicker">UN VIAJE, MUCHOS RECUERDOS</span>
      <h1>Tolosa <span>→</span> Granada</h1>
    </header>

    <nav class="modes" aria-label="Modo de recorrido">
      <button class="mode-button active" id="road-mode">El viaje de verdad</button>
      <button class="mode-button" id="direct-mode">Tolosa → Granada</button>
    </nav>

    <main>
      <section id="map-container" aria-label="Mapa del viaje">
        <div id="map"></div>
        <div id="car" aria-label="Coche del viaje">🚙</div>
      </section>

      <aside class="stops-panel" aria-label="Paradas del viaje">
        <p class="panel-kicker">NUESTRO RECORRIDO</p>
        <h2>Las paradas</h2>
        <ol id="stop-list"></ol>
        <button id="next-stop" class="next-button">Seguimos <span>→</span></button>
        <p id="status" aria-live="polite">Preparando el recorrido…</p>
      </aside>

      <section id="memory-panel" class="memory-panel" hidden>
        <button id="close-memory" class="close-button" aria-label="Cerrar recuerdo">×</button>
        <span class="panel-kicker">UN RECUERDO DE ESTE VIAJE</span>
        <h2 id="memory-title"></h2>
        <div id="memory-content"></div>
        <button id="memory-continue" class="next-button">Seguimos <span>→</span></button>
      </section>
    </main>
  </div>

  <script src="js/map.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
